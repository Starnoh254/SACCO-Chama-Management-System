services:
  app:
    container_name: sacco-backend
    build: .
    ports:
      - "8080:8080"
    networks:
      - s-network

  postgres:
    container_name: sacco-db
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sacco_db
    ports:
      - "5433:5432"
    networks:
      - s-network
    volumes:
      - postgres-s-data:/var/lib/postgresql

networks:
  s-network:
    driver: bridge

volumes:
  postgres-s-data: